  <text class="mono l12" x="20" y="298"><tspan class="dim">   </tspan><tspan class="val">ML model training &amp; eval</tspan></text>
  <text class="mono l13" x="20" y="316"><tspan class="dim">   </tspan><tspan class="val">Plant pathology classification</tspan></text>

  <text class="mono dim l14" x="20" y="338">─────────────────────────────────</text>

