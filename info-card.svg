  <text class="mono l15" x="20" y="360"><tspan class="key">llm/agents</tspan><tspan class="dim">.....</tspan><tspan class="val">LangChain · LangGraph</tspan></text>
  <text class="mono l16" x="20" y="380"><tspan class="key">ml</tspan><tspan class="dim">...............</tspan><tspan class="val">PyTorch · OpenCV</tspan></text>
  <text class="mono l17" x="20" y="400"><tspan class="key">vector db</tspan><tspan class="dim">.......</tspan><tspan class="val">ChromaDB · FAISS</tspan></text>
  <text class="mono l18" x="20" y="420"><tspan class="key">backend</tspan><tspan class="dim">.........</tspan><tspan class="val">FastAPI · Express.js</tspan></text>
  <text class="mono l19" x="20" y="440"><tspan class="key">cloud</tspan><tspan class="dim">...........</tspan><tspan class="val">Azure · GCP</tspan></text>
  <text class="mono l20" x="20" y="460"><tspan class="key">frontend</tspan><tspan class="dim">........</tspan><tspan class="val">React</tspan></text>

  <text class="mono dim l21" x="20" y="482">─────────────────────────────────</text>
</svg>
