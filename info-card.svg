    .l25 { animation: fi .001s 2.00s forwards; opacity:0; }
    .l26 { animation: fi .001s 2.08s forwards; opacity:0; }
    .l27 { animation: fi .001s 2.16s forwards; opacity:0; }
    .l28 { animation: fi .001s 2.24s forwards; opacity:0; }
