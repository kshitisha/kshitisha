  <!-- Title bar -->
  <rect x="0" y="0" width="520" height="28" fill="#161b22"/>
  <circle cx="16" cy="14" r="5" fill="#ff5f56"/>
  <circle cx="32" cy="14" r="5" fill="#ffbd2e"/>
  <circle cx="48" cy="14" r="5" fill="#27c93f"/>
  <text class="mono dim" x="180" y="19" font-size="11">kshitisha@github — neofetch</text>

  <!-- neofetch user@host header -->
  <text class="mono l0" x="20" y="60">
    <tspan class="prompt">kshitisha</tspan><tspan fill="#c9d1d9">@</tspan><tspan fill="#58a6ff">github</tspan>
  </text>
  <text class="mono dim l1" x="20" y="78">─────────────────────────────────</text>

